name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（例如 v0.1.1）'
        required: true
        default: 'v0.1.1'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: todo-x86_64-unknown-linux-gnu
            binary: todo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: todo-x86_64-pc-windows-msvc.exe
            binary: todo.exe
          - os: macos-14
            target: aarch64-apple-darwin
            asset: todo-aarch64-apple-darwin
            binary: todo
          - os: macos-14
            target: x86_64-apple-darwin
            asset: todo-x86_64-apple-darwin
            binary: todo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
