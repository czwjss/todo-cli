name: Publish PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.1）'
        required: true
        default: 'v0.1.1'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload to PyPI
        working-directory: python
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "待发布版本：${VERSION}"
          if curl -fsSL "https://pypi.org/pypi/czwjss-todo-cli/${VERSION}/json" >/dev/null 2>&1; then
            echo "PyPI 已存在 ${VERSION}，跳过上传"
          else
            python -m pip install --upgrade twine
            twine upload --non-interactive -u __token__ -p "$PYPI_API_TOKEN" dist/*
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: python/dist
